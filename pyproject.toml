[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate"
version = "0.1.0"
description = "Train-only LifeMate evaluation and local inference interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eda = ["numpy>=1.26", "matplotlib>=3.8"]
asr-analysis = ["numpy>=1.26", "pandas>=2.2", "rapidfuzz>=3.9"]
asr = [
    "numpy>=1.26", "pandas>=2.2", "torch>=2.6",
    "transformers==5.14.1", "huggingface-hub==1.24.0",
    "tokenizers==0.22.2", "safetensors==0.8.0",
    "soundfile==0.13.1", "psutil==7.1.0", "librosa==0.11.0",
]

[project.scripts]
lifemate-dev = "lifemate.evaluation.benchmark:main"
lifemate-explore = "lifemate.exploration:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "lifemate.asr.data*", "lifemate.asr.analysis*", "lifemate.asr.artifacts*",
    "lifemate.asr.models*", "lifemate.asr.checkpoints*",
]
