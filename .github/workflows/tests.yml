name: Dataset-independent Python tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[eda]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_dev_benchmark.py --help
      - run: python scripts/explore_lifemate.py --help
      - run: python -m unittest discover -s src/lifemate/asr/tests -p test_adapter.py -v
      - run: python -m pip install -e ".[asr-analysis]"
      - run: python -m unittest discover -s src/lifemate/asr/tests -v
